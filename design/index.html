<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>梅花易数算命网站原型</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            padding: 20px;
        }
        .prototype-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        .frame-container {
            border: 1px solid #ddd;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
        }
        .frame-title {
            padding: 10px 15px;
            background-color: #f0f0f0;
            border-bottom: 1px solid #ddd;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .device-frame {
            width: 100%;
            height: 812px; /* iPhone 15 Pro height */
            border: none;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: #333;
        }
        .description {
            max-width: 800px;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="container mx-auto">
        <h1 class="text-center font-bold">梅花易数算命网站原型</h1>
        
        <div class="description">
            <p class="mb-4">这是一个基于梅花易数的算命网站原型，提供每日命理分析服务。以下是主要界面的原型展示：</p>
        </div>
        
        <div class="prototype-container">
            <!-- 未登录首页 -->
            <div class="frame-container">
                <div class="frame-title">
                    <span>未登录首页 (landing.html)</span>
                </div>
                <iframe src="landing.html" class="device-frame"></iframe>
            </div>
            
            <!-- 已登录首页 -->
            <div class="frame-container">
                <div class="frame-title">
                    <span>已登录首页 (home.html)</span>
                </div>
                <iframe src="home.html" class="device-frame"></iframe>
            </div>
            
            <!-- 算命结果页 -->
            <div class="frame-container">
                <div class="frame-title">
                    <span>算命结果 (fortune.html)</span>
                </div>
                <iframe src="fortune.html" class="device-frame"></iframe>
            </div>
            
            <!-- 个人资料页 -->
            <div class="frame-container">
                <div class="frame-title">
                    <span>个人资料 (profile.html)</span>
                </div>
                <iframe src="profile.html" class="device-frame"></iframe>
            </div>
            
            <!-- 设置页 -->
            <div class="frame-container">
                <div class="frame-title">
                    <span>设置 (settings.html)</span>
                </div>
                <iframe src="settings.html" class="device-frame"></iframe>
            </div>
            
            <!-- 历史记录页 -->
            <div class="frame-container">
                <div class="frame-title">
                    <span>历史记录 (history.html)</span>
                </div>
                <iframe src="history.html" class="device-frame"></iframe>
            </div>
        </div>
    </div>
</body>
</html>
